<!DOCTYPE html>
<html lang="hu-HU" class="no-js scheme_default">

<head>
    <title>404 – Az oldal nem található | Evolution Rezidence</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#283e28">
    <link rel="icon" type="image/x-icon" href="images/logo.webp" />

    <link rel='stylesheet' href='css/font-face/css/fonts_pack.css' type='text/css' media='all' />
    <link rel='stylesheet' href='css/fontello/css/fontello-embedded.css' type='text/css' media='all' />
    <link rel='stylesheet' href='css/style.css' type='text/css' media='all' />
    <link rel='stylesheet' href='css/template-color.css' type='text/css' media='all' />
    <link rel='stylesheet' href='css/responsive.css' type='text/css' media='all' />

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .error404-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #283E28;
            background-image: url(images/udvar-pavilon.webp);
            background-size: cover;
            background-position: center;
            position: relative;
            text-align: center;
            padding: 40px 20px;
        }

        .error404-page::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30, 45, 30, 0.8);
            z-index: 1;
        }

        .error404-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 50px 50px 40px;
        }

        .error404-logo {
            margin-bottom: 40px;
        }

        .error404-logo img {
            width: 100px;
            height: auto;
            opacity: 1;
        }

        .error404-code {
            font-family: 'Cinzel', serif;
            font-size: 140px;
            font-weight: 700;
            color: #C9A96E;
            line-height: 1;
            margin: 0 0 10px 0;
            text-shadow: 0 2px 20px rgba(0,0,0,0.4);
        }

        .error404-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            margin: 0 0 20px 0;
            text-shadow: 0 2px 12px rgba(0,0,0,0.4);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .error404-description {
            font-family: 'Open Sans', sans-serif;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.7;
            margin: 0 0 40px 0;
            text-shadow: 0 1px 8px rgba(0,0,0,0.3);
        }

        .error404-button {
            display: inline-block;
            padding: 14px 40px;
            background: transparent;
            color: #ffffff;
            border: 2px solid #C9A96E;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .error404-button:hover {
            background-color: #C9A96E;
            color: #1a2a1a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 169, 110, 0.3);
        }

        .error404-footer {
            position: relative;
            z-index: 2;
            margin-top: 60px;
            font-family: 'Open Sans', sans-serif;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
        }

        .error404-footer a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
        }

        .error404-footer a:hover {
            color: #C9A96E;
        }

        @media (max-width: 767px) {
            .error404-code {
                font-size: 90px;
            }
            .error404-subtitle {
                font-size: 20px;
                letter-spacing: 2px;
            }
            .error404-description {
                font-size: 15px;
            }
            .error404-logo img {
                width: 75px;
            }
        }
    </style>
</head>

<body>
    <div class="error404-page">
        <div class="error404-content">
            <div class="error404-logo">
                <a href="index.html">
                    <img src="images/logo.webp" alt="Evolution Rezidence" />
                </a>
            </div>
            <h1 class="error404-code">404</h1>
            <h2 class="error404-subtitle" data-i18n="e404_subtitle">Az oldal nem található</h2>
            <p class="error404-description" data-i18n="e404_desc">
                A keresett oldal nem létezik, vagy áthelyezésre került.<br>
                Kérjük, térjen vissza a főoldalra.
            </p>
            <a href="index.html" class="error404-button" data-i18n="e404_btn">Vissza a főoldalra</a>
        </div>
        <div class="error404-footer">
            Evolution Rezidence &copy; <span id="date"></span>
        </div>
    </div>

    <script>
        document.getElementById('date').textContent = new Date().getFullYear();
    </script>
    <script src="js/custom/i18n.js"></script>
</body>

</html>
